
name: Deploy FastAPI to AWS EC2 via SSM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy on EC2 via Systems Manager
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0c9896093fd63f284 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sudo -u ubuntu bash -lc '\''cd /home/ubuntu/fastapi-blog && bash deploy.sh'\''"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0c9896093fd63f284; then
            echo "Deployment command completed."
          else
            echo "Deployment failed. Fetching command details..."
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0c9896093fd63f284 \
            --query '{Status:Status,ExitCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0c9896093fd63f284 \
            --query 'Status' \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
